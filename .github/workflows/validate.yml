name: Validate question bank
on:
  push:
    paths: ['data/**', 'tools/**']
  pull_request:
    paths: ['data/**', 'tools/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build_index.py
